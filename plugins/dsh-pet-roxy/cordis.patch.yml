# ============================================================================
# dsh-pet-roxy 的 bundle patch —— 把 Roxy 宠物插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是 dsh-pet-roxy 的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的
#   patch 叠起来组成配置树。本文件就是 dsh-pet-roxy 这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块）
#   - name: 'dsh-pet-roxy' 会解析包入口 lib/index.js（宿主半侧）
#
# 【注意】
#   - 不要改成 name: ./xxx.mjs?v=N 形式（那是手动复制到 profile 的热更写法，
#     发布给他人会因路径不存在而破坏启动）
# ============================================================================

- insert:
    - id: pet-roxy
      name: 'dsh-pet-roxy'
