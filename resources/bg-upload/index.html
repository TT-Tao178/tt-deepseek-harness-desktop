<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; img-src 'self' file: data:; style-src 'unsafe-inline'">
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 18px; color: #1a1d21; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .tip { background: #f0f4ff; border: 1px solid #d6e2ff; border-radius: 8px; padding: 10px 12px;
         font-size: 12px; line-height: 1.8; color: #34405a; margin-bottom: 12px; }
  #info { font-size: 12px; color: #666; margin: 8px 0; min-height: 16px; }
  #preview { max-width: 100%; max-height: 250px; display: none; border-radius: 6px; border: 1px solid #eee; }
  button { padding: 7px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 8px; font-size: 13px; }
  button:hover { background: #f5f6f8; }
  #apply { background: #4d7cfe; color: #fff; border-color: #4d7cfe; }
  #apply:hover { background: #3a63d6; }
  #apply:disabled { opacity: .5; cursor: not-allowed; }
</style></head>
<body>
  <h2>上传背景图片</h2>
  <div class="tip">
    建议：<br>
    · 比例：<b>16:9</b>（21:9 超宽屏也可以）<br>
    · 分辨率：≥ <b>1920×1080</b><br>
    · 大小：≤ 20MB<br>
    · 格式：PNG / JPG / JPEG / WebP / GIF
  </div>
  <div id="info">尚未选择图片</div>
  <img id="preview" alt="预览">
  <div>
    <button id="pick">选择图片…</button>
    <button id="apply" disabled>设为背景</button>
    <button id="cancel">取消</button>
  </div>
  <script>
    let picked = null;
    const $ = (id) => document.getElementById(id);
    $('pick').onclick = async () => {
      const r = await bgApi.pick();
      if (!r || !r.path) return;
      picked = r.path;
      $('info').textContent = '已选择：' + r.path.split(/[\\/]/).pop();
      $('info').style.color = '#666';
      if (r.thumb) { $('preview').src = r.thumb; }
      else { $('preview').src = 'file:///' + r.path.replace(/\\/g, '/'); }
      $('preview').style.display = 'block';   // 修复：'' 会回落到 CSS 的 display:none，缩略图永不显示
      $('preview').onload = function () {
        $('info').textContent = '已选择：' + r.path.split(/[\\/]/).pop()
          + '（' + $('preview').naturalWidth + '×' + $('preview').naturalHeight + '）';
      };
      $('apply').disabled = false;
    };
    $('apply').onclick = async () => {
      const r = await bgApi.apply(picked);
      if (r && r.ok) window.close();
      else {
        $('info').textContent = '设置失败：' + (r && r.error ? r.error : '未知错误');
        $('info').style.color = '#c0392b';
      }
    };
    $('cancel').onclick = async () => { await bgApi.cancel(); };
  </script>
</body></html>
