[workspace]
resolver = "2"
members = ["crates/shell-core", "crates/kernel-process", "crates/kernel-update", "src/app"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
