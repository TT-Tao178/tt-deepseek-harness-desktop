[package]
name = "tt-desktop-app"
description = "TT DeepSeek Harness Desktop - Tauri 2 shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
shell-core = { path = "../../crates/shell-core" }
kernel-process = { path = "../../crates/kernel-process" }
kernel-update = { path = "../../crates/kernel-update" }